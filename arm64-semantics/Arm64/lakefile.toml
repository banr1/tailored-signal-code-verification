# Lake package for the trusted AArch64 ISA model, semantics, and spec vocabulary
# (`Arm64.lean` + `Arm64/Trusted/**`). It has no dependencies, so `lake build` here
# compiles only trusted definitions and never sees `ProofLib` or `Examples` on `LEAN_PATH`.
# Module paths are resolved from the repository root (`srcDir = ".."`), so
# `Arm64.Trusted.ISA.Syntax` is `../Arm64/Trusted/ISA/Syntax.lean`.
name = "arm64"
version = "0.1.0"
srcDir = ".."
defaultTargets = ["Arm64"]
# Lean's per-process memory cap (`-M`, MiB). `weakLeanArgs` are not part of the build trace;
# `lake serve` forwards `moreGlobalServerArgs` to every `lean --worker`.
weakLeanArgs = ["-M", "12288"]
moreGlobalServerArgs = ["-M", "12288"]

[leanOptions]
warningAsError = true
autoImplicit = false
relaxedAutoImplicit = false

# `Arm64.lean` + `Arm64.Trusted.*`; `Arm64.Testing.*` belongs to the root package's `Testing` library.
#
# `precompileModules = true` compiles the library to `libarm64_Arm64_Trusted.so`, so the decoder,
# evaluator, and `c_spec` / `c_type_spec` elaborators run as native code at elaboration time
# instead of in the IR interpreter. `libName` must equal the initialization stem of the single
# root (`initialize_arm64_Arm64_Trusted`): only then does Lake load the shared library with
# `--plugin` rather than `--load-dynlib` (`LeanLib.isPlugin`), and only a plugin's initializer
# runs the runtime-phase initializers that `module` importers of `Arm64.Trusted.*` otherwise skip
# (leaving closed constants used by the spec elaborators uninitialized). The root cannot be
# `Arm64` instead: roots claim every module they prefix, which would include `Arm64.Testing.*`.
# Modules outside the root's import closure (`Arm64`, `Arm64.Trusted.Surface.IncludeBytes`,
# `Arm64.Trusted.Surface.FileBytes`, `Arm64.Trusted.Spec.RustHeap`,
# `Arm64.Trusted.Spec.GlobalAlloc`) have only meta-phase initializers, which Lean runs on import.
#
# `globs` lists every module of the library explicitly, in link order, before the wildcard: Lake
# links `libarm64_Arm64_Trusted.so` in glob-expansion order, and it expands a wildcard in the
# filesystem's (unsorted, machine-dependent) directory order. A module reached only through the
# wildcard would change the `.so` trace hash between machines and so miss the build cache in every
# downstream module. Add a new module before the wildcard, after the modules it imports (`ci-tools
# lib-globs`, run by `scripts/pre-push-check` and CI, fails if one is missing). The trailing
# wildcard only re-reaches listed modules.
[[lean_lib]]
name = "Arm64"
roots = ["Arm64.Trusted"]
globs = [
  "Arm64.Trusted.ISA.Syntax",
  "Arm64.Trusted.ISA.Decode",
  "Arm64.Trusted.ISA.Memory",
  "Arm64.Trusted.ISA.State",
  "Arm64.Trusted.Syscalls.Include.Errno",
  "Arm64.Trusted.Syscalls.Include.Uapi",
  "Arm64.Trusted.Syscalls.Common",
  "Arm64.Trusted.Syscalls.Fs.ReadWrite",
  "Arm64.Trusted.Syscalls.Fs.ReadWritev",
  "Arm64.Trusted.Syscalls.Fs.Ioctl",
  "Arm64.Trusted.Syscalls.Stdio",
  "Arm64.Trusted.Syscalls.Fs.Open",
  "Arm64.Trusted.Syscalls.Fs.Stat",
  "Arm64.Trusted.Syscalls.Fs.Fcntl",
  "Arm64.Trusted.Syscalls.FileIo",
  "Arm64.Trusted.Syscalls.Mm.Mmap",
  "Arm64.Trusted.Syscalls.Mm.Mprotect",
  "Arm64.Trusted.Syscalls.Mm.Mremap",
  "Arm64.Trusted.Syscalls.Mm.Madvise",
  "Arm64.Trusted.Syscalls.Alloc",
  "Arm64.Trusted.Syscalls.Kernel.Signal",
  "Arm64.Trusted.Syscalls.Signals",
  "Arm64.Trusted.Syscalls.Kernel.Time",
  "Arm64.Trusted.Syscalls.Time",
  "Arm64.Trusted.Syscalls.Drivers.Random",
  "Arm64.Trusted.Syscalls.Random",
  "Arm64.Trusted.Syscalls.Kernel.Exit",
  "Arm64.Trusted.Syscalls.Kernel.Sys",
  "Arm64.Trusted.Syscalls.Misc",
  "Arm64.Trusted.Syscalls.Fs.Select",
  "Arm64.Trusted.Syscalls.Poll",
  "Arm64.Trusted.Syscalls",
  "Arm64.Trusted.ISA.Float",
  "Arm64.Trusted.ISA.Eval",
  "Arm64.Trusted.ISA.Semantics",
  "Arm64.Trusted.Object.Reloc",
  "Arm64.Trusted.Object.Placed",
  "Arm64.Trusted.Object.Labels",
  "Arm64.Trusted.Spec.AsciiNum",
  "Arm64.Trusted.Spec.RustAbi",
  "Arm64.Trusted.Spec.RustRuntime",
  "Arm64.Trusted.Spec.SepLogic",
  "Arm64.Trusted.Spec.Hoare",
  "Arm64.Trusted.Spec.Placed",
  "Arm64.Trusted.Spec.RustHeap",
  "Arm64.Trusted.Spec.GlobalAlloc",
  "Arm64.Trusted.Surface.Abi",
  "Arm64.Trusted.Surface.CType",
  "Arm64.Trusted.Surface.HexCode",
  "Arm64.Trusted.Surface.Ascii",
  "Arm64.Trusted",
  "Arm64",
  "Arm64.Trusted.Surface.IncludeBytes",
  "Arm64.Trusted.Surface.FileBytes",
  "Arm64.Trusted.Process.Types",
  "Arm64.Trusted.Process.Loader",
  "Arm64.Trusted.Process.Assumptions",
  "Arm64.Trusted.Process.Semantics",
  "Arm64.Trusted.Process.Placed",
  "Arm64.Trusted.Process.Overrides",
  "Arm64.Trusted.Process.OverrideWellBehaved",
  "Arm64.Trusted.Process",
  "Arm64.Trusted.Spec.SepLogicModel",
  "Arm64.Legacy.Object.LinkedImage",
  "Arm64.Legacy.Object.Loader",
  "Arm64.Legacy.Spec.Library",
  "Arm64.Legacy.Spec.Helpers",
  "Arm64.Legacy",
  "Arm64.Trusted.*",
  "Arm64.Legacy.*",
]
libName = "arm64_Arm64_Trusted"
precompileModules = true
