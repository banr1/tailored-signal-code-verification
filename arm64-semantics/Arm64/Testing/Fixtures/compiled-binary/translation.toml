# Translation configuration for `Arm64/Testing/Fixtures/compiled-binary` (`rust-obj2lean`).

crates = ["examples"]
obj_name = "examples"
namespace_prefix = "Testing.Generators"
hashed_inputs = [
    "Cargo.toml",
    "Cargo.lock",
    "src/lib.rs",
    "src/arithmetic_and_branches.rs",
    "src/automation_survey.rs",
    "src/compositional_calls.rs",
    "src/functional_correctness.rs",
    "src/machine_code_and_loops.rs",
    "src/memory_and_stack.rs",
    "src/sep_wp_examples.rs",
    "src/simd_and_atomics.rs",
]

[[targets]]
name = "functions"
lean_file = "Arm64/Testing/Generators/CompiledBinaryFixture.lean"
prog_name = "functionsBin"
title = "`Arm64/Testing/Fixtures/compiled-binary` (`src/functions.rs`)"
hashed_inputs = ["src/functions.rs", "src/algorithms.rs", "src/syscalls.rs"]
lemma_allowlist = [
    "xor_swap",
    "control_flow",
    "move_2_regs_to_heap",
    "reg_offset",
    "decoder_bug_regressions",
    "arith_shift",
    "max_u64",
    "clamp_u64",
    "abs_diff_u64",
    "saturating_add_u64",
    "extract_bitfield",
    "bit_tricks",
