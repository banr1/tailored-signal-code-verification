[package]
name = "adequacy_tour"
version = "0.1.0"
edition = "2024"
publish = false
# Standalone `#![no_std]` crate containing small illustrative Rust programs for
# `Arm64/Testing/Tours/SpecAdequacyTour.lean`, compiled to AArch64 machine code
# and exported to Lean 4 (`Arm64/Testing/Generators/AdequacyTourFixture.lean` and
# `Arm64/Testing/Generators/AdequacyTourFixture.bin`).

[lib]
crate-type = ["rlib"]

[profile.release]
opt-level = 2
lto = false
codegen-units = 1
panic = "abort"
debug = false
overflow-checks = false
