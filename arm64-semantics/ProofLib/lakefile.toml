# Lake package for the untrusted verification automation (`ProofLib.lean` + `ProofLib/**`):
# normalization simp lemmas, separation logic, symbolic execution, and VCGen. It depends only on
# the trusted `arm64` package, so `Examples` is never on `LEAN_PATH` when building here.
# Module paths are resolved from the repository root (`srcDir = ".."`).
name = "prooflib"
version = "0.1.0"
srcDir = ".."
packagesDir = "../.lake/packages"
defaultTargets = ["ProofLib"]
weakLeanArgs = ["-M", "12288"]
moreGlobalServerArgs = ["-M", "12288"]

[leanOptions]
warningAsError = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.unreachableTactic = false
weak.linter.unnecessarySeqFocus = false

[[require]]
name = "arm64"
path = "../Arm64"

# `globs` lists every module of the library explicitly, in link order, with no wildcard: Lake
# links `libprooflib_ProofLib.so` in glob-expansion order, and it expands a wildcard in the
# filesystem's (unsorted, machine-dependent) directory order, which would change the `.so` trace
# hash between machines and so miss the build cache in every downstream module. A `ProofLib.*`
# wildcard would also pull the separate `ProofLib.Testing` library below into this precompiled
# library. Add a new module to this list, after the modules it imports; a module missing from the
# list is not part of the `ProofLib` library.
[[lean_lib]]
name = "ProofLib"
