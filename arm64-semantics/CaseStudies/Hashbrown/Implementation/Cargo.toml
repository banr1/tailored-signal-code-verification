[package]
name = "hashbrown-verified"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "hashbrown_verified"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "hashbrown-cli"
path = "src/main.rs"

[dependencies]
# `vendor/hashbrown` is a gitignored symlink to `third_party/hashbrown-0.17.1`
# (`$HASHBROWN_SRC`, see `[upstream]` in `translation.toml`).
hashbrown = { path = "vendor/hashbrown", default-features = false }

[profile.release]
opt-level = 2
lto = false
codegen-units = 1
panic = "abort"
debug = false
overflow-checks = false
