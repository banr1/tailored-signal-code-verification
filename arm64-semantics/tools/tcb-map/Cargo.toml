[package]
name = "tcb-map"
version = "0.1.0"
edition = "2024"
description = "Self-contained repository trust classification (--tree / --tree-json), import-DAG enforcement (--check-imports), and core soundness / role-purity guard (--check)"

[[bin]]
name = "tcb-map"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
