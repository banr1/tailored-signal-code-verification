[package]
name = "rust-obj2lean"
version = "0.1.0"
edition = "2024"
publish = false

# Host CLI tool that compiles each configured Rust crate to one relocatable AArch64
# object (`.o`), links the objects, and exports the result to Lean as an
# `Arm64.Obj.LinkedImage`; see `translation.toml` files and `src/main.rs`.

[dependencies]
anyhow = "1"
cargo_metadata = "0.19"
clap = { version = "4", features = ["derive"] }
gimli = { version = "0.32", default-features = false, features = ["read", "std"] }
hex = "0.4"
itertools = "0.14"
object = "0.36"
regex = "1"
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
toml = "0.8"
walkdir = "2"
which = "7"

[dev-dependencies]
libc = "0.2"
object = { version = "0.36", features = ["write"] }
unicorn-engine = { version = "=2.1.3", default-features = false, features = ["arch_aarch64"] }

