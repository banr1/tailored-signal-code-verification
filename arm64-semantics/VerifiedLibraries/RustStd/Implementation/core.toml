# `core::slice::memchr::memrchr`, and `core::fmt::write`) from the pinned
# `aarch64-unknown-linux-musl` sysroot (`libcore-89491010f55f6617.rlib`,
# SHA-256 3397f27434f891334ee2e29352a2fbab8de590e93b496379ee8bc1ab4b17cca9).

obj_name = "core"
namespace_prefix = "VerifiedLibraries.RustStd"
obj_file = "RustStd/Generated/CoreObj.lean"
