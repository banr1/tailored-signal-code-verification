# Events of the libsignal session binary (`third_party/libsignal/libsignal-session`, libsignal
# v0.105.4's one-to-one session code), as a reference table.
#
# Documentation only: no tool reads this file. The trusted event table is the Lean value
# `libsignalEvents` in `Symbolic/Specifications/Hardware/MachineEvents.lean`, with the
# API list `libsignalApi` (same file) and the struct layouts in
# `Symbolic/Specifications/Rust/SessionLayout.lean`.
# Nothing checks that the two agree; keep them in step by hand.
#
# This file lists every point where control leaves the binary's own code, and says which events
# each one emits:
#   * the 3 API functions (`src/lib.rs`). `session_message_encrypt` and
#     `session_message_decrypt_signal` correspond to the model's `messageEncrypt` and
#     `messageDecrypt`;
#   * every extern stub of the binary (136, image offsets `0x6ee60`-`0x6f07c`), and the 6 modeled
#     system calls.
# Code compiled into the image is not listed: no events come from it except through the API rows
# above. That includes the in-memory stores (`InMemSessionStore`, `InMemIdentityKeyStore`,
# `InMemSignalProtocolStore`; store operations emit no hardware events, record contents are tied
# through `leak`) and the whole `bytes`, `uuid`, `prost` and `spqr` crates (`translation.toml`).
# Rows with `emits = "none"` have no counterpart in `libsignalEvents`, and neither do the
# `[[syscall]]` rows: system calls are not event sources (`AugStep.lean`). The stub list is that of
# the binary exported with rustc 1.98.1; another toolchain can change it.
#
# Notes:
#   * `store` event removed: the hardware `store` event was removed from `MachineEvent`. Record
#     contents are tied through `leak` (`recordBytes`, `LeakMatches`, `SessionReadOk`).
#   * `send` is emitted only when `session_message_encrypt` returns
#     `Some(Ok(CiphertextMessage::SignalMessage(_)))` (word0 == `encryptSignalMessageTag`).
#     On error or early stop, only `pt` is emitted.
#   * `accept` is emitted on normal return of `session_message_decrypt_signal` when it returns
#     `Some(Ok(_))` (word0 == `decryptOkTag`).
#   * SPQR (sparse post-quantum ratchet) is in-image code; the `libcrux` ML-KEM (module-lattice key
#     encapsulation mechanism) and HMAC (hash-based message authentication code) functions that it
#     and libsignal's `kem` module call are stubs with `emits = "none"` (out of scope).

tags = ["pt", "send", "rng", "accept", "recv", "leak"]   # `leak`: the environment's compromise move

[types]
# Byte buffers at fixed offsets of compiled structs (aarch64 layouts from `-Zprint-type-sizes` on
# this image's build): `SignalMessage.serialized: Box<[u8]>` at +40 (ptr) / +48 (len); in the
# 248-byte `Option<Result<CiphertextMessage, SignalProtocolError>>` the `SignalMessage` payload is
# at +8, so its `serialized` is at +48 / +56.
"SignalMessage" = "bytes_at(40, 48)"
"Option<Result<CiphertextMessage,SignalProtocolError>>" = "bytes_at(48, 56)"
"ProtocolAddress" = "u64"   # opaque: only passed by reference
"SessionRecord" = "u64"     # opaque: in-image store object

# ---- API functions (the environment's calls; one call = one atomic protocol step) ----

# libsignal `message_encrypt::<HookRng>` = DyLean `messageEncrypt` / `messageEncryptAbort`. `pt`
# (the plaintext, matched with `genRand`) on entry; `send` (the serialized `SignalMessage`,
# matched with `sendMessage`) at exit only on `Some(Ok(CiphertextMessage::SignalMessage(_)))`.
# The trailing `now: SystemTime` (16 bytes) has no register left and goes on the stack, so it is
# not in `sig` (only register parameters are).
[[api]]
symbol = "session_message_encrypt"
sig = "fn(ptext: &[u8], remote_address: &ProtocolAddress, local_address: &ProtocolAddress, session_store: &mut dyn SessionStore, identity_store: &mut dyn IdentityKeyStore) -> Option<Result<CiphertextMessage, SignalProtocolError>>"
emits = [{ tag = "pt", from = "ptext" },
         { tag = "send", from = "ret", at = "exit", cond = "isSignalMessage" }]

# libsignal `message_decrypt_signal::<HookRng>` = DyLean `messageDecrypt` (runs the DH ratchet
# inside). `recv` on entry: the wire bytes of the delivered message (`SignalMessage.serialized`),
# matched with the attacker's `Network` re-send just before `messageDecrypt`. Its fresh ratchet
# key is an `rng` (RNG hook). At exit, emits payload-free `accept` on `Some(Ok(_))` (matches
# model's stored state entry).
[[api]]
symbol = "session_message_decrypt_signal"
sig = "fn(ciphertext: &SignalMessage, remote_address: &ProtocolAddress, local_address: &ProtocolAddress, session_store: &mut dyn SessionStore, identity_store: &mut dyn IdentityKeyStore) -> Option<Result<Vec<u8>, SignalProtocolError>>"
emits = [{ tag = "recv", from = "ciphertext" },
         { tag = "accept", at = "exit", cond = "isOk" }]

# The wire parse before decrypt: no protocol step of its own (the delivered message is the
# `recv` of the decrypt call that consumes it, so a parse alone emits nothing).
[[api]]
symbol = "session_signal_message_parse"
emits = "none"

# ---- Syscalls (every modeled one) ----

[[syscall]]
nr = 278   # getrandom: OS randomness
sig = "fn(buf: &mut [u8], flags: u32) -> usize"
emits = [{ tag = "rng", from = "buf", at = "exit" }]

[[syscall]]
nr = 64    # write: the session code does no I/O (stdout/stderr only)
emits = "none"

[[syscall]]
nr = 93    # exit
emits = "none"

[[syscall]]
nr = 94    # exit_group
emits = "none"

[[syscall]]
nr = 214   # brk
emits = "none"

[[syscall]]
nr = 222   # mmap
emits = "none"

# ---- Extern stubs (every stub of the image: 136) ----

# OS randomness (`/dev/urandom` fallback of the `getrandom` crate): bytes written to `dest`.
# Not on the session API paths (they use `HookRng`), but any OS randomness is an `rng`.
[[extern]]
symbol = "getrandom::backends::linux_android_with_fallback::use_file_fallback"
sig = "fn(dest: &mut [u8]) -> Result<(), Error>"
emits = [{ tag = "rng", from = "dest", at = "exit" }]

# The RNG hook `libsignal_session_rng_fill(dst: *mut u8, len: usize)` (same two registers
# as `&mut [u8]`). Every `csprng` of the session code is `HookRng` (src/lib.rs), so every
# fresh value of the protocol (e.g. the DH ratchet key pair) is an `rng` event.
[[extern]]
symbol = "libsignal_session_rng_fill"
sig = "fn(dst: &mut [u8])"
emits = [{ tag = "rng", from = "dst", at = "exit" }]

