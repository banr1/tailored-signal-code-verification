[package]
name = "libsignal-cli-ratchet"
version = "0.1.0"
edition = "2024"
publish = false
# The ratchet calls of the `libsignal-cli` CLI (`../`): libsignal's `message_encrypt` and
# `message_decrypt_signal`. `src/lib.rs` says why they are a crate of their own. Part of the
# `libsignal-session` image (`../../translation.toml`): build it from there, with that crate's
# `Cargo.lock` and release profile.
#
# NOTE: standalone like the parent crate: no `[workspace]` table.

[lib]
crate-type = ["rlib"]

[dependencies]
libsignal-protocol = { path = "../../vendor/libsignal/rust/protocol" }
# Same version as the other crates of the image (libsignal v0.105.4's lock).
rand_core = { version = "=0.9.5", default-features = false }
